# 9. API Status Codes

| Operation | Success |
|---|---:|
| Register | 201 |
| Login | 200 |
| Get resource | 200 |
| Create resource | 201 |
| Update resource | 200 |
| Delete resource | 200 |
| Invalid input | 400 |
| Invalid/missing JWT | 401 |
| Resource not found / unauthorized ownership | 404 |
| Duplicate resource | 409 |
| Unexpected server error | 500 |

