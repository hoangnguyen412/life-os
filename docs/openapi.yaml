# 3. Authentication API

## 3.1 Register

```http
POST /api/auth/register
```

### Request

```json
{
  "email": "user@example.com",
  "password": "password123",
  "name": "Nguyen"
}
```

### Rules

- `email` is required and unique.
- `password` is required.
- Password is hashed with bcrypt.
- Plain-text password is never stored.
- Duplicate email → `409 CONFLICT`.

### Response — 201

```json
{
  "success": true,
  "data": {
    "user": {
      "id": "USER_ID",
      "email": "user@example.com",
      "name": "Nguyen"
    }
  }
}
```

---

## 3.2 Login

```http
POST /api/auth/login
```

### Request

```json
{
  "email": "user@example.com",
  "password": "password123"
}
```

### Response — 200

```json
{
  "success": true,
  "data": {
    "token": "JWT_TOKEN",
    "user": {
      "id": "USER_ID",
      "email": "user@example.com",
      "name": "Nguyen"
    }
  }
}
```

Invalid credentials:

```text
401 UNAUTHORIZED
```

---

