# Life OS — Backend API Contract

## 1. API Conventions

### Base URL

```text
/api
```

Example:

```text
POST /api/auth/login
GET  /api/tasks
```

### Content Type

All request/response bodies use:

```http
Content-Type: application/json
```

### Authentication

All endpoints require JWT except:

```text
POST /api/auth/register
POST /api/auth/login
```

Protected requests:

```http
Authorization: Bearer <JWT>
```

After JWT verification:

```text
req.userId
```

is attached by `authMiddleware`.

Every protected database query must be scoped by `userId`.

---

# 2. Standard Response Format

## Success — Single Resource / Mutation

```json
{
  "success": true,
  "data": {}
}
```

## Success — Collection

```json
{
  "success": true,
  "data": []
}
```

## Success — Paginated Collection

```json
{
  "success": true,
  "data": [],
  "pagination": {
    "page": 1,
    "limit": 20,
    "total": 45,
    "totalPages": 3
  }
}
```

## Error

```json
{
  "success": false,
  "error": {
    "code": "VALIDATION_ERROR",
    "message": "Title is required",
    "field": "title"
  }
}
```

### Standard Error Codes

| Code | HTTP |
|---|---:|
| `VALIDATION_ERROR` | 400 |
| `UNAUTHORIZED` | 401 |
| `NOT_FOUND` | 404 |
| `CONFLICT` | 409 |
| `SERVER_ERROR` | 500 |

