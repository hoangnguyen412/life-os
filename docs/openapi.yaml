    "title": "Complete API",
    "description": "Finish Task API",
    "status": "todo",
    "dueDate": "2026-10-12T16:59:59.000Z",
    "goalId": "GOAL_ID",
    "priority": "high",
    "completedAt": null,
    "createdAt": "2026-10-08T08:00:00.000Z",
    "updatedAt": "2026-10-08T08:00:00.000Z"
  }
}
```

Resource belonging to another user:

```text
404 NOT_FOUND
```

---

## 4.4 Update Task

```http
PUT /api/tasks/:id
```

### Request

Editable fields:

```json
{
  "title": "Complete Backend API",
  "description": "Finish and test API",
  "status": "in_progress",
  "dueDate": "2026-10-13T16:59:59.000Z",
  "goalId": "GOAL_ID",
  "priority": "high"
}
```

### Rules

- `userId` cannot be changed.
- `goalId` must belong to the current user.
- `status → done` sets `completedAt`.
- `done → another status` clears `completedAt`.
- Changing `goalId` recalculates both old and new Goals.

### Response — 200

```json
{
  "success": true,
  "data": {}
}
```

---

## 4.5 Delete Task

```http
DELETE /api/tasks/:id
```

### Rules

If the Task has `goalId`:

```text
Delete Task
    ↓
Recalculate Goal progress
```

### Response — 200

```json
{
  "success": true,
  "data": {
    "id": "TASK_ID"
  }
}
```

