# 4. Task API

## 4.1 List Tasks

```http
GET /api/tasks
```

### Query Parameters

| Parameter | Type | Required | Description |
|---|---|---|---|
| `status` | string | No | `todo`, `in_progress`, `done` |
| `goalId` | ObjectId | No | Filter by Goal |
| `overdue` | boolean | No | `true` = overdue only |
| `sort` | string | No | Sorting rule |
| `page` | number | No | Default `1` |
| `limit` | number | No | Default `20` |

### Overdue Definition

```text
dueDate < now
AND
status != done
```

### Example

```http
GET /api/tasks?status=todo&overdue=true&page=1&limit=20
```

### Response — 200

```json
{
  "success": true,
  "data": [
    {
      "id": "TASK_ID",
      "userId": "USER_ID",
      "title": "Complete API",
      "description": "Finish Task API",
      "status": "todo",
      "dueDate": "2026-10-12T16:59:59.000Z",
      "goalId": "GOAL_ID",
      "priority": "high",
      "completedAt": null,
      "createdAt": "2026-10-08T08:00:00.000Z",
      "updatedAt": "2026-10-08T08:00:00.000Z"
    }
  ],
  "pagination": {
    "page": 1,
    "limit": 20,
    "total": 1,
    "totalPages": 1
  }
}
```

---

## 4.2 Create Task

```http
POST /api/tasks
```

### Request

```json
{
  "title": "Complete API",
  "description": "Finish Task API",
  "status": "todo",
  "dueDate": "2026-10-12T16:59:59.000Z",
  "goalId": "GOAL_ID",
  "priority": "high"
}
```

### Rules

- `userId` is taken from JWT, never from request body.
- `status` must be `todo | in_progress | done`.
- `priority` must be `low | medium | high`.
- `goalId` is optional.
- If `goalId` exists, the Goal must belong to the current user.
- If initial status is `done`, `completedAt` is set.
- Otherwise `completedAt = null`.

### Response — 201

```json
{
  "success": true,
  "data": {
    "id": "TASK_ID",
    "userId": "USER_ID",
    "title": "Complete API",
    "description": "Finish Task API",
    "status": "todo",
    "dueDate": "2026-10-12T16:59:59.000Z",
    "goalId": "GOAL_ID",
    "priority": "high",
    "completedAt": null,
    "createdAt": "2026-10-08T08:00:00.000Z",
    "updatedAt": "2026-10-08T08:00:00.000Z"
  }
}
```

---

