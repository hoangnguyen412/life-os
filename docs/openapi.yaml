# 7. Dashboard API

## 7.1 Summary

```http
GET /api/dashboard/summary
```

### Response — 200

```json
{
  "success": true,
  "data": {
    "totalTasks": 10,
    "completedTasks": 4,
    "overdueTasks": 2,
    "avgGoalProgress": 65
  }
}
```

### Definitions

`totalTasks`

```text
All Tasks belonging to current user
```

`completedTasks`

```text
Tasks where status = done
```

`overdueTasks`

```text
dueDate < now
AND
status != done
```

`avgGoalProgress`

```text
Average progress of active Goals
```

If there are no active Goals:

```text
avgGoalProgress = 0
```

---

# 8. Authorization Rules

Every protected endpoint follows:

```text
JWT
 ↓
req.userId
 ↓
Service query
 ↓
filter by userId
```

Examples:

```text
GET /api/tasks/:id
```

must internally behave like:

```text
findOne({
  _id: taskId,
  userId: req.userId
})
```

The same ownership rule applies to:

```text
Tasks
Goals
CalendarEvents
```

A resource belonging to another user is treated as:

```text
404 NOT_FOUND
```

