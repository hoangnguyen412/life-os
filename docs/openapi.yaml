# 5. Goal API

## 5.1 List Goals

```http
GET /api/goals
```

### Response — 200

```json
{
  "success": true,
  "data": []
}
```

---

## 5.2 Create Goal

```http
POST /api/goals
```

### Request — Task Based

```json
{
  "title": "Finish Life OS",
  "deadline": "2026-10-20T16:59:59.000Z",
  "progressMode": "task_based"
}
```

### Request — Manual

```json
{
  "title": "Learn Backend",
  "deadline": "2026-11-01T16:59:59.000Z",
  "progressMode": "manual",
  "manualProgress": 60
}
```

### Rules

`progressMode`:

```text
task_based | manual
```

For `task_based`:

```text
progress = completed tasks / total tasks × 100
```

For no Tasks:

```text
progress = 0
status = active
```

For `manual`:

```text
progress = manualProgress
```

### Response — 201

```json
{
  "success": true,
  "data": {}
}
```

---

## 5.3 Get Goal

```http
GET /api/goals/:id
```

### Response — 200

```json
{
  "success": true,
  "data": {}
}
```

---

## 5.4 Update Goal

```http
PUT /api/goals/:id
```

### Request

```json
{
  "title": "Finish Life OS MVP",
  "deadline": "2026-10-25T16:59:59.000Z",
  "progressMode": "task_based"
}
```

### Rules

When changing:

```text
manual → task_based
```

Recalculate progress immediately.

When changing:

```text
task_based → manual
```

Set:

```text
manualProgress = current progress
```

### Response — 200

```json
{
  "success": true,
  "data": {}
}
```

---

## 5.5 Update Manual Progress

```http
PATCH /api/goals/:id/progress
```

### Request

```json
{
  "progress": 60
}
```

### Rules

Only allowed when:

```text
progressMode = manual
```

For `task_based`:

```text
400 VALIDATION_ERROR
```

### Response — 200

```json
{
  "success": true,
  "data": {}
}
```

---

## 5.6 Delete Goal

```http
DELETE /api/goals/:id
```

### Rules

Deleting a Goal must NOT delete its Tasks.

Instead:

```text
Task.goalId → null
```

Only Tasks belonging to the current user are updated.

### Response — 200

```json
{
  "success": true,
  "data": {
    "id": "GOAL_ID"
  }
}
```

