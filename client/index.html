<!doctype html>
<!-- HTML shell for the React application; UI content is rendered by src/main.jsx. -->
<html lang="en">
  <head>
    <!-- UTF-8 supports accented text; viewport enables responsive mobile layouts. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Life OS — manage your tasks, goals, and calendar in one place." />
    <meta name="theme-color" content="#ffffff" />
    <title>Life OS</title>
  </head>
  <body>
    <!-- createRoot mounts the application here. The module script starts Vite's entry graph. -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
